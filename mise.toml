[tools]
go = '1.26.3'
golangci-lint = "latest"
goreleaser = "latest"
lefthook = "latest"

[tasks.init]
run = 'lefthook install'

[tasks.release]
description = "Release a new version. Usage: mise run release -- v1.0.0"
run = '''
#!/usr/bin/env bash
set -eou pipefail

VERSION=${1:-}
if [ -z "$VERSION" ]; then
  echo "Usage: mise run release -- <version>"
  echo "Example: mise run release -- v1.0.0"
  exit 1
fi

if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
  echo "Error: version must follow vX.Y.Z format (e.g. v1.2.3)"
  exit 1
fi

if [ -n "$(git status --porcelain)" ]; then
  echo "Error: working directory is dirty. Commit or stash changes before releasing."
  git status --short
  exit 1
fi

export GITHUB_TOKEN=$(gh auth token)

git tag "$VERSION"
git push origin "$VERSION"

goreleaser release --clean
'''

[tasks.lint]
run = """
#!/usr/bin/env bash
set -eou pipefail
go mod tidy
golangci-lint run ./...
go test ./...
"""

[tasks.fix]
run = """
#!/usr/bin/env bash
set -eou pipefail
go mod tidy
golangci-lint run --fix ./...
go test ./...
"""

[tasks.test]
run = 'go test ./...'
